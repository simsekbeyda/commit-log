# Tüm uygulamayı tek komutla başlatır:  docker compose up --build
# Uygulama: http://localhost:3000  ·  API/Swagger: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commitlog
      POSTGRES_USER: commitlog
      POSTGRES_PASSWORD: commitlog
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitlog -d commitlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./code-diary
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/commitlog
      DATABASE_USERNAME: commitlog
      DATABASE_PASSWORD: commitlog
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Boş bırakılırsa AI demo modunda çalışır
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      JWT_SECRET: ${JWT_SECRET:-change-me-docker-compose-secret-0123456789}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./code-diary-frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
