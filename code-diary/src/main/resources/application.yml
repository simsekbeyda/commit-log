server:
  port: 8080

spring:
  config:
    # .env dosyasındaki OPENAI_API_KEY gibi değişkenleri otomatik yükler
    import: optional:file:.env[.properties]

  messages:
    basename: messages
    encoding: UTF-8
    # Aksi halde Türkçe işletim sisteminde İngilizce istekler de Türkçe mesaj alırdı
    fallback-to-system-locale: false

  datasource:
    url: jdbc:h2:file:./data/codediarydb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  ai:
    openai:
      # Anahtar yoksa uygulama yine açılır, sadece AI uç noktaları 503 döner
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: https://api.openai.com
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.4
    retry:
      # Varsayılan 10 deneme + üstel bekleme, hata durumunda isteği dakikalarca askıda bırakıyordu
      max-attempts: 2
      backoff:
        initial-interval: 1s
        max-interval: 3s
      # 4xx hataları (geçersiz anahtar, kota aşımı vb.) tekrar denenmez
      exclude-on-http-codes: 400,401,403,404,429

  cache:
    cache-names: ai-results
    # AI yanıtları pahalı: en fazla 2000 sonuç, 24 saat saklanır
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed-demo-data: true
  jwt:
    # Üretimde mutlaka JWT_SECRET ortam değişkeniyle değiştirin (en az 32 karakter)
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    ttl: 7d
  ai:
    # OpenAI anahtarı yoksa kural tabanlı demo yanıtları kullanılır (false → AI uç noktaları 503 döner)
    demo-mode: ${AI_DEMO_MODE:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
