server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: bilinmeyen yollar index.html'e düşer (ör. /journals/5 sayfa yenilenince)
    location / {
        try_files $uri /index.html;
    }

    # Dosya adında hash olan statik dosyalar uzun süre önbelleklenebilir
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
